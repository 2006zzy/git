<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>冰蓝星辰爱心 · 青球绕流</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background-color: #0d1533;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            color: #ffffff;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1533);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(3.5, 2.5, 5.5);

        const container = document.getElementById('canvas-container');
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 环境贴图（保留玻璃质感）
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.target.set(0, 0, 0);
        controls.update();

        // ----- 灯光：亮度减半 (原强度 * 0.5) -----
        scene.add(new THREE.AmbientLight(0x88aadd, 1.1 * 0.5));

        const mainLight = new THREE.PointLight(0xffffff, 3.2 * 0.5);
        mainLight.position.set(3, 4, 5);
        scene.add(mainLight);

        const cyanLight = new THREE.PointLight(0x33ccff, 2.6 * 0.5);
        cyanLight.position.set(-4, 2, -3);
        scene.add(cyanLight);

        const blueLight = new THREE.PointLight(0x3388ff, 2.2 * 0.5);
        blueLight.position.set(0, -3, -5);
        scene.add(blueLight);

        const topLight = new THREE.DirectionalLight(0xddeeff, 1.1 * 0.5);
        topLight.position.set(0, 5, 0);
        scene.add(topLight);

        scene.add(new THREE.HemisphereLight(0x88ccff, 0x112244, 1.0 * 0.5));

        // ----- 核心爱心：透明度降低60% (0.25 -> 0.85) -----
        function createIrregularDiamondHeart() {
            const vertices = [];
            const indices = [];
            const colors = [];
            const scale = 2.4;
            const div = 26;
            const fatScaleX = 0.9;
            const fatScaleZ = 1;
            const fatScaleY = 1.3;

            const colorPalette = [
                new THREE.Color(0x1a5fa8),
                new THREE.Color(0x3fa9ff),
                new THREE.Color(0x66e0ff),
                new THREE.Color(0xeefaff)
            ];

            for (let i = 0; i <= div; i++) {
                const u = (i / div) * Math.PI * 2;
                for (let j = 0; j <= div; j++) {
                    const v = (j / div) * Math.PI;
                    const sinU = Math.sin(u),
                        cosU = Math.cos(u);
                    const sinV = Math.sin(v),
                        cosV = Math.cos(v);

                    const hx = 15 * sinU - 4 * Math.sin(3 * u);
                    const hz = 15 * cosU - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u);

                    let px = sinV * hx / 17;
                    let py = 8 * cosV / 17;
                    let pz = sinV * hz / 17;

                    const jitter = 0.085;
                    const randomFactor = Math.sin(i * 0.7 + j * 1.1) * jitter;
                    px += randomFactor * px;
                    py += randomFactor * py * 0.4;
                    pz += randomFactor * pz;

                    const edgeFactor = Math.pow(Math.abs(sinV), 6);
                    px += edgeFactor * (Math.random() - 0.5) * 0.35;
                    pz += edgeFactor * (Math.random() - 0.5) * 0.35;

                    px *= fatScaleX;
                    pz *= fatScaleZ;
                    py *= fatScaleY;

                    vertices.push(px * scale, py * scale * 1.1, pz * scale);

                    const t = (py + 0.7) / 1.4;
                    const color = new THREE.Color();
                    if (t < 0.33) {
                        color.lerpColors(colorPalette[0], colorPalette[1], t * 3);
                    } else if (t < 0.66) {
                        color.lerpColors(colorPalette[1], colorPalette[2], (t - 0.33) * 3);
                    } else {
                        color.lerpColors(colorPalette[2], colorPalette[3], (t - 0.66) * 3);
                    }
                    colors.push(color.r, color.g, color.b);
                }
            }

            for (let i = 0; i < div; i++) {
                for (let j = 0; j < div; j++) {
                    const a = i * (div + 1) + j;
                    const b = i * (div + 1) + j + 1;
                    const c = (i + 1) * (div + 1) + j;
                    const d = (i + 1) * (div + 1) + j + 1;
                    indices.push(a, d, b);
                    indices.push(a, c, d);
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setIndex(indices);
            geometry.computeVertexNormals(true);

            const material = new THREE.MeshPhysicalMaterial({
                vertexColors: true,
                emissive: 0x1a6ad8,
                emissiveIntensity: 0.45 * 0.5,
                roughness: 0.15,
                metalness: 0.0,
                transparent: true,
                opacity: 0.85, // 透明度降低60% (原0.25 → 0.85)
                transmission: 0.4,
                thickness: 0.5,
                ior: 1.5,
                specularIntensity: 1.4,
                specularColor: 0xffffff,
                clearcoat: 1.0,
                clearcoatRoughness: 0.08,
                side: THREE.DoubleSide,
                flatShading: true,
                depthWrite: false,
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = -Math.PI / 2;
            return mesh;
        }

        const heart = createIrregularDiamondHeart();

        // ----- 星辰粒子：青色渐变 + 球体形状 -----
        const PARTICLE_COUNT = 5200;
        let particleGeometry = new THREE.BufferGeometry();
        let particleMaterial = new THREE.PointsMaterial({
            size: 0.1,
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            opacity: 1.0,
            sizeAttenuation: true
        });
        let particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        let particleData = [];

        function generateParticles() {
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);
            const data = [];

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                // ---- 球体分布 (均匀球壳) ----
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                const radius = 3.6 + Math.random() * 8.4;

                const px = radius * Math.sin(phi) * Math.cos(theta);
                const py = radius * Math.cos(phi) * 0.85;
                const pz = radius * Math.sin(phi) * Math.sin(theta);

                const cloudFactor = 0.8 + Math.random() * 0.4;
                const finalX = px * cloudFactor;
                const finalY = py * cloudFactor;
                const finalZ = pz * cloudFactor;

                positions[i * 3] = finalX;
                positions[i * 3 + 1] = finalY;
                positions[i * 3 + 2] = finalZ;

                data.push({
                    originX: finalX,
                    originY: finalY,
                    originZ: finalZ,
                    phase: Math.random() * Math.PI * 2,
                    amplitude: 0.15 + Math.random() * 0.22
                });

                // ---- 青色渐变：从深青到亮青白 ----
                const dist = Math.sqrt(finalX * finalX + finalY * finalY + finalZ * finalZ);
                const normDist = Math.min(dist / 12.0, 1.0);

                // 青色渐变：从 (0,0.6,0.8) 到 (0.8,1,1)
                const r = 0.0 + 0.8 * normDist;
                const g = 0.6 + 0.4 * normDist;
                const b = 0.8 + 0.2 * normDist;

                // 轻微随机变化，更自然
                const variation = 0.85 + Math.random() * 0.3;
                colors[i * 3] = r * variation;
                colors[i * 3 + 1] = g * variation;
                colors[i * 3 + 2] = b * variation;
            }

            return { positions, colors, data };
        }

        function initParticles() {
            const result = generateParticles();
            particleData = result.data;
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(result.positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(result.colors, 3));
            particleGeometry = geo;
            particleSystem = new THREE.Points(geo, particleMaterial);
        }
        initParticles();

        // ----- 背景星星 (也减半亮度，保持氛围) -----
        function createStars() {
            const count = 800;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const radius = 4.5 + Math.random() * 6;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);

                positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta) * 0.6 + 0.2;
                positions[i * 3 + 2] = radius * Math.cos(phi);

                const bright = (0.7 + Math.random() * 0.5) * 0.5;
                const tint = Math.random();
                if (tint < 0.35) {
                    colors[i * 3] = bright;
                    colors[i * 3 + 1] = bright;
                    colors[i * 3 + 2] = bright;
                } else if (tint < 0.7) {
                    colors[i * 3] = bright * 0.65;
                    colors[i * 3 + 1] = bright * 0.85;
                    colors[i * 3 + 2] = bright;
                } else {
                    colors[i * 3] = bright * 0.55;
                    colors[i * 3 + 1] = bright * 0.8;
                    colors[i * 3 + 2] = bright * 0.95;
                }
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                vertexColors: true,
                size: 0.09,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                opacity: 1.0,
                sizeAttenuation: true
            });

            return new THREE.Points(geometry, material);
        }

        const stars = createStars();
        scene.add(stars);

        // ----- 辅助元素（网格减半透明度）-----
        const gridHelper = new THREE.GridHelper(8, 16, 0x336688, 0x223344);
        gridHelper.position.y = -2.0;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.06;
        scene.add(gridHelper);

        // ----- 组合场景 -----
        const spinGroup = new THREE.Group();
        spinGroup.add(heart);
        spinGroup.add(particleSystem);
        scene.add(spinGroup);

        const rotationSpeed = 0.008;
        const BPM = 20;
        let elapsedTime = 0;

        // ----- 粒子呼吸更新 -----
        function updateParticles(time) {
            const positions = particleGeometry.attributes.position.array;
            const heartPhase = time * (BPM / 60) * Math.PI * 2;
            let pulseFactor = 1 + 0.12 * Math.sin(heartPhase) * 0.6 + 0.06 * Math.sin(heartPhase * 2 + 0.5);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const data = particleData[i];
                const individualPhase = data.phase + time * 0.22;
                const individualPulse = 1 + 0.15 * Math.sin(individualPhase) * data.amplitude;
                const combinedPulse = (pulseFactor + individualPulse * 0.3) / 1.3;
                const scaleFactor = combinedPulse;

                positions[i * 3] = data.originX * scaleFactor;
                positions[i * 3 + 1] = data.originY * scaleFactor;
                positions[i * 3 + 2] = data.originZ * scaleFactor;
            }
            particleGeometry.attributes.position.needsUpdate = true;

            const sizePulse = 0.1 + 0.02 * (pulseFactor - 0.9) * 2;
            particleMaterial.size = THREE.MathUtils.clamp(sizePulse, 0.07, 0.14);
        }

        // ----- 动画循环 -----
        function animate() {
            requestAnimationFrame(animate);
            elapsedTime += 0.016;

            spinGroup.rotation.y += rotationSpeed;
            updateParticles(elapsedTime);
            stars.rotation.y += 0.0001;

            const heartPulse = 1 + 0.025 * Math.sin(elapsedTime * (BPM / 60) * Math.PI * 2);
            heart.scale.setScalar(heartPulse);

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
