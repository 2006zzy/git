<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>双心星辰 · 椭圆轨道</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background-color: #0b0710;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            color: #ffffff;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .info {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            color: rgba(255,255,255,0.25);
            font-size: 14px;
            letter-spacing: 2px;
            pointer-events: none;
            text-shadow: 0 0 12px rgba(0,0,0,0.7);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="info">鸿蒙生两仪，此心终不移</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        // --- 初始化场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0710);

        const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 60);
        camera.position.set(6, 4, 10);
        camera.lookAt(0, 0, 0);

        const container = document.getElementById('canvas-container');
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.06).texture;

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.autoRotate = false;
        controls.target.set(0, 0, 0);
        controls.update();

        // --- 灯光 ---
        scene.add(new THREE.AmbientLight(0x8899bb, 1.2 * 0.6));

        const mainLight = new THREE.DirectionalLight(0xffeef8, 2.0 * 0.6);
        mainLight.position.set(2, 5, 6);
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x88ccff, 1.6 * 0.6);
        fillLight.position.set(-4, 1, -3);
        scene.add(fillLight);

        const backLight = new THREE.DirectionalLight(0xff99bb, 1.4 * 0.6);
        backLight.position.set(-1, -2, -6);
        scene.add(backLight);

        scene.add(new THREE.HemisphereLight(0x88bbff, 0x331122, 0.9 * 0.6));

        // --- 工具函数：创建爱心 ---
        function createHeart(style = 'cyan') {
            const vertices = [];
            const indices = [];
            const colors = [];
            const scale = 2.2;
            const div = 26;
            const fatScaleX = 0.9;
            const fatScaleZ = 1.0;
            const fatScaleY = 1.3;

            let colorPalette;
            if (style === 'cyan') {
                colorPalette = [
                    new THREE.Color(0x1a5fa8),
                    new THREE.Color(0x3fa9ff),
                    new THREE.Color(0x66e0ff),
                    new THREE.Color(0xeefaff)
                ];
            } else {
                colorPalette = [
                    new THREE.Color(0x7a1a3a),
                    new THREE.Color(0xcc3a6a),
                    new THREE.Color(0xff6699),
                    new THREE.Color(0xffd0dd)
                ];
            }

            for (let i = 0; i <= div; i++) {
                const u = (i / div) * Math.PI * 2;
                for (let j = 0; j <= div; j++) {
                    const v = (j / div) * Math.PI;
                    const sinU = Math.sin(u), cosU = Math.cos(u);
                    const sinV = Math.sin(v), cosV = Math.cos(v);

                    const hx = 15 * sinU - 4 * Math.sin(3 * u);
                    const hz = 15 * cosU - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u);

                    let px = sinV * hx / 17;
                    let py = 8 * cosV / 17;
                    let pz = sinV * hz / 17;

                    const jitter = 0.085;
                    const randomFactor = Math.sin(i * 0.7 + j * 1.1) * jitter;
                    px += randomFactor * px;
                    py += randomFactor * py * 0.4;
                    pz += randomFactor * pz;

                    const edgeFactor = Math.pow(Math.abs(sinV), 6);
                    px += edgeFactor * (Math.random() - 0.5) * 0.35;
                    pz += edgeFactor * (Math.random() - 0.5) * 0.35;

                    px *= fatScaleX;
                    pz *= fatScaleZ;
                    py *= fatScaleY;

                    vertices.push(px * scale, py * scale * 1.1, pz * scale);

                    const t = (py + 0.7) / 1.4;
                    const color = new THREE.Color();
                    if (t < 0.33) {
                        color.lerpColors(colorPalette[0], colorPalette[1], t * 3);
                    } else if (t < 0.66) {
                        color.lerpColors(colorPalette[1], colorPalette[2], (t - 0.33) * 3);
                    } else {
                        color.lerpColors(colorPalette[2], colorPalette[3], (t - 0.66) * 3);
                    }
                    colors.push(color.r, color.g, color.b);
                }
            }

            for (let i = 0; i < div; i++) {
                for (let j = 0; j < div; j++) {
                    const a = i * (div + 1) + j;
                    const b = i * (div + 1) + j + 1;
                    const c = (i + 1) * (div + 1) + j;
                    const d = (i + 1) * (div + 1) + j + 1;
                    indices.push(a, d, b);
                    indices.push(a, c, d);
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setIndex(indices);
            geometry.computeVertexNormals(true);

            const emissiveColor = style === 'cyan' ? 0x1a6ad8 : 0xaa3366;
            const material = new THREE.MeshPhysicalMaterial({
                vertexColors: true,
                emissive: emissiveColor,
                emissiveIntensity: 0.45 * 0.5,
                roughness: 0.15,
                metalness: 0.0,
                transparent: true,
                opacity: 0.88,
                transmission: 0.35,
                thickness: 0.5,
                ior: 1.5,
                specularIntensity: 1.3,
                specularColor: 0xffffff,
                clearcoat: 1.0,
                clearcoatRoughness: 0.08,
                side: THREE.DoubleSide,
                flatShading: true,
                depthWrite: false,
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = -Math.PI / 2;
            return mesh;
        }

        // --- 创建两个爱心 ---
        const heartCyan = createHeart('cyan');
        const heartPink = createHeart('pink');

        // --- 创建星群粒子 ---
        function createParticleSystem(count, colorStyle, radiusMin = 3.0, radiusMax = 8.0) {
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const data = [];

            for (let i = 0; i < count; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                const radius = radiusMin + Math.random() * (radiusMax - radiusMin);

                let px = radius * Math.sin(phi) * Math.cos(theta);
                let py = radius * Math.cos(phi) * 0.85;
                let pz = radius * Math.sin(phi) * Math.sin(theta);

                const cloudFactor = 0.85 + Math.random() * 0.3;
                px *= cloudFactor;
                py *= cloudFactor;
                pz *= cloudFactor;

                positions[i * 3] = px;
                positions[i * 3 + 1] = py;
                positions[i * 3 + 2] = pz;

                data.push({
                    originX: px,
                    originY: py,
                    originZ: pz,
                    phase: Math.random() * Math.PI * 2,
                    amplitude: 0.12 + Math.random() * 0.2
                });

                const dist = Math.sqrt(px * px + py * py + pz * pz);
                const normDist = Math.min(dist / 12.0, 1.0);

                let r, g, b;
                if (colorStyle === 'cyan') {
                    r = 0.0 + 0.8 * normDist;
                    g = 0.6 + 0.4 * normDist;
                    b = 0.8 + 0.2 * normDist;
                } else {
                    r = 0.6 + 0.4 * normDist;
                    g = 0.1 + 0.7 * normDist;
                    b = 0.25 + 0.65 * normDist;
                }
                const variation = 0.85 + Math.random() * 0.3;
                colors[i * 3] = r * variation;
                colors[i * 3 + 1] = g * variation;
                colors[i * 3 + 2] = b * variation;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.095,
                vertexColors: true,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                opacity: 1.0,
                sizeAttenuation: true
            });

            const points = new THREE.Points(geometry, material);
            points.userData = { data, geometry, material };
            return points;
        }

        const particleCyan = createParticleSystem(4800, 'cyan', 3.0, 8.2);
        const particlePink = createParticleSystem(4800, 'pink', 3.0, 8.2);

        // --- 背景星星 ---
        function createBackgroundStars() {
            const count = 1200;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const radius = 12 + Math.random() * 18;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = radius * Math.cos(phi) * 0.6;
                positions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);

                const bright = (0.3 + Math.random() * 0.5) * 0.6;
                const tint = Math.random();
                if (tint < 0.4) {
                    colors[i * 3] = bright * 0.8;
                    colors[i * 3 + 1] = bright * 0.9;
                    colors[i * 3 + 2] = bright;
                } else if (tint < 0.7) {
                    colors[i * 3] = bright;
                    colors[i * 3 + 1] = bright * 0.7;
                    colors[i * 3 + 2] = bright * 0.8;
                } else {
                    colors[i * 3] = bright * 0.9;
                    colors[i * 3 + 1] = bright * 0.6;
                    colors[i * 3 + 2] = bright * 0.7;
                }
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                vertexColors: true,
                size: 0.08,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                opacity: 0.8,
                sizeAttenuation: true
            });
            return new THREE.Points(geometry, material);
        }
        const bgStars = createBackgroundStars();
        scene.add(bgStars);

        // --- 构建双星系统 ---
        const groupCyan = new THREE.Group();
        groupCyan.add(heartCyan);
        groupCyan.add(particleCyan);
        scene.add(groupCyan);

        const groupPink = new THREE.Group();
        groupPink.add(heartPink);
        groupPink.add(particlePink);
        scene.add(groupPink);

        // --- 位置设定 ---
        const separation = 7.2;
        groupCyan.position.x = -separation / 2;
        groupPink.position.x = separation / 2;
        groupCyan.position.y = 0.2;
        groupPink.position.y = -0.2;

        // --- 母组：用于整体椭圆轨道运动 ---
        const masterGroup = new THREE.Group();
        scene.remove(groupCyan);
        scene.remove(groupPink);
        masterGroup.add(groupCyan);
        masterGroup.add(groupPink);
        scene.add(masterGroup);

        // --- 轨道可视化 (椭圆轨迹线) ---
        function createOrbitLine(a = 6.5, b = 4.0, segments = 120) {
            const points = [];
            for (let i = 0; i <= segments; i++) {
                const t = (i / segments) * Math.PI * 2;
                const x = a * Math.cos(t);
                const z = b * Math.sin(t);
                points.push(new THREE.Vector3(x, 0, z));
            }
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: 0x4488bb,
                transparent: true,
                opacity: 0.15,
                blending: THREE.AdditiveBlending,
            });
            return new THREE.Line(geometry, material);
        }

        // 椭圆参数：长轴6.5，短轴4.0
        const orbitLine = createOrbitLine(6.5, 4.0);
        scene.add(orbitLine);

        // 再添加一条更淡的副轨
        const orbitLine2 = createOrbitLine(6.5, 4.0);
        orbitLine2.material = orbitLine2.material.clone();
        orbitLine2.material.opacity = 0.06;
        orbitLine2.material.color.setHex(0x88ddff);
        orbitLine2.position.y = -0.3;
        scene.add(orbitLine2);

        // 椭圆轨迹上的小光点标记
        function createOrbitMarkers(a = 6.5, b = 4.0, count = 16) {
            const group = new THREE.Group();
            const sphereGeo = new THREE.SphereGeometry(0.04, 6, 6);
            const mat = new THREE.MeshBasicMaterial({
                color: 0x88ccff,
                transparent: true,
                opacity: 0.3,
                blending: THREE.AdditiveBlending,
            });
            for (let i = 0; i < count; i++) {
                const t = (i / count) * Math.PI * 2;
                const x = a * Math.cos(t);
                const z = b * Math.sin(t);
                const sphere = new THREE.Mesh(sphereGeo, mat);
                sphere.position.set(x, 0, z);
                group.add(sphere);
            }
            return group;
        }
        const markers = createOrbitMarkers(6.5, 4.0);
        scene.add(markers);

        // --- 辅助网格 (微弱) ---
        const gridHelper = new THREE.GridHelper(14, 20, 0x446688, 0x224466);
        gridHelper.position.y = -2.8;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.06;
        scene.add(gridHelper);

        // --- 动画状态 ---
        const rotationSpeedSelf = 0.006;
        const rotationSpeedOrbit = 0.0035;
        let elapsedTime = 0;
        const BPM = 50;

        // 椭圆轨道参数
        const orbitA = 6.5; // 长轴 (X方向)
        const orbitB = 4.0; // 短轴 (Z方向)
        let orbitAngle = 0;
        const orbitSpeed = 0.003; // 轨道旋转速度

        // --- 粒子更新函数 ---
        function updateParticles(group, time, pulseOffset = 0) {
            const points = group.children.find(child => child.isPoints);
            if (!points) return;
            const geometry = points.geometry;
            const positions = geometry.attributes.position.array;
            const data = points.userData.data;
            if (!data) return;

            const heartPhase = time * (BPM / 50) * Math.PI * 2 + pulseOffset;
            let pulseFactor = 1 + 0.2 * Math.sin(heartPhase) * 0.6 + 0.06 * Math.sin(heartPhase * 1.5 + 0.5);

            for (let i = 0; i < data.length; i++) {
                const d = data[i];
                const individualPhase = d.phase + time * 0.22;
                const individualPulse = 1 + 0.15 * Math.sin(individualPhase) * d.amplitude;
                const combinedPulse = (pulseFactor + individualPulse * 0.3) / 1.3;
                const scaleFactor = combinedPulse;

                positions[i * 3] = d.originX * scaleFactor;
                positions[i * 3 + 1] = d.originY * scaleFactor;
                positions[i * 3 + 2] = d.originZ * scaleFactor;
            }
            geometry.attributes.position.needsUpdate = true;

            const sizePulse = 0.095 + 0.02 * (pulseFactor - 0.9) * 2;
            points.material.size = THREE.MathUtils.clamp(sizePulse, 0.07, 0.14);
        }

        // --- 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);
            elapsedTime += 0.016;

            // === 椭圆轨道运动 ===
            orbitAngle += orbitSpeed *5;
            // 计算椭圆上的位置 (在XZ平面上)
            const x = orbitA * Math.cos(orbitAngle);
            const z = orbitB * Math.sin(orbitAngle);
            masterGroup.position.x = x;
            masterGroup.position.z = z;

            // 让母组稍微上下浮动增加生动感 (微小)
            masterGroup.position.y = 0.15 * Math.sin(orbitAngle * 0.7);

            // 母组自身绕Y轴旋转 (让两个星群整体朝向轨道方向)
            // 使得双星连线始终指向轨道切线方向? 这里保持原有公转逻辑不变
            // 但为了让视觉效果更丰富，我们让母组的朝向稍微跟随轨道切线
            // 或者保留之前的masterGroup.rotation.y自转，这里我们让轨道运动独立
            // 母组自身的旋转用于"公转"效果，即两个星群相互绕转
            masterGroup.rotation.y += rotationSpeedOrbit * 5;

            // 每个星群自转 (绕自身Y轴)
            groupCyan.rotation.y += rotationSpeedSelf * 0.8;
            groupPink.rotation.y += rotationSpeedSelf * 0.8;

            // 爱心自身微脉冲
            const heartPulse = 1 + 0.025 * Math.sin(elapsedTime * (BPM / 50) * Math.PI * 2);
            heartCyan.scale.setScalar(heartPulse);
            heartPink.scale.setScalar(heartPulse);

            // 更新粒子
            updateParticles(groupCyan, elapsedTime, 0);
            updateParticles(groupPink, elapsedTime, 1.2);

            // 背景星星缓慢旋转
            bgStars.rotation.y += 0.00015;
            bgStars.rotation.x += 0.00005;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- 自适应 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
