<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>蓝血玻璃爱心 · 冷色星辰绕流</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        overflow: hidden;
        background-color: #0a0d18;
        font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
        color: #ffffff;
        user-select: none;
    }

    #canvas-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }
</style>
</head>
<body>
    <div id="canvas-container"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0d18);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(3.5, 2.5, 5.5);

        const container = document.getElementById('canvas-container');
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 玻璃反射环境贴图
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.target.set(0, 0, 0);
        controls.update();

        // 灯光（冷色调：冰蓝 / 青 / 蓝）
        scene.add(new THREE.AmbientLight(0x9ab8ff, 1.05));

        const mainLight = new THREE.PointLight(0xe8f0ff, 3.2);
        mainLight.position.set(3, 4, 5);
        scene.add(mainLight);

        const cyanLight = new THREE.PointLight(0x55ccff, 2.6);
        cyanLight.position.set(-4, 2, -3);
        scene.add(cyanLight);

        const blueLight = new THREE.PointLight(0x3388ff, 2.2);
        blueLight.position.set(0, -3, -5);
        scene.add(blueLight);

        const topLight = new THREE.DirectionalLight(0xd6e8ff, 1.1);
        topLight.position.set(0, 5, 0);
        scene.add(topLight);

        // 冷色天空/地面半球光
        scene.add(new THREE.HemisphereLight(0x9ac8ff, 0x0a1420, 1.0));

        // 饱满不规则菱形爱心（蓝血玻璃）
        function createIrregularDiamondHeart() {
            const vertices = [];
            const indices = [];
            const colors = [];
            const scale = 2.4;

            const div = 26;

            const fatScaleX = 0.9;
            const fatScaleZ = 1;
            const fatScaleY = 1.3;

            // 蓝血渐变：深蓝 → 湛蓝 → 亮蓝 → 冰白
            const colorPalette = [
                new THREE.Color(0x0a1f4a),  // 深蓝（底部）
                new THREE.Color(0x1a5fb8),  // 湛蓝
                new THREE.Color(0x3fa0ff),  // 亮蓝
                new THREE.Color(0xd8f0ff)   // 冰白蓝（顶部）
            ];

            for (let i = 0; i <= div; i++) {
                const u = (i / div) * Math.PI * 2;

                for (let j = 0; j <= div; j++) {
                    const v = (j / div) * Math.PI;

                    const sinU = Math.sin(u);
                    const cosU = Math.cos(u);
                    const sinV = Math.sin(v);
                    const cosV = Math.cos(v);

                    const hx = 15 * sinU - 4 * Math.sin(3 * u);
                    const hz = 15 * cosU - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u);

                    let px = sinV * hx / 17;
                    let py = 8 * cosV / 17;
                    let pz = sinV * hz / 17;

                    const jitter = 0.085;
                    const randomFactor = Math.sin(i * 0.7 + j * 1.1) * jitter;

                    px += randomFactor * px;
                    py += randomFactor * py * 0.4;
                    pz += randomFactor * pz;

                    const edgeFactor = Math.pow(Math.abs(sinV), 6);
                    px += edgeFactor * (Math.random() - 0.5) * 0.35;
                    pz += edgeFactor * (Math.random() - 0.5) * 0.35;

                    px *= fatScaleX;
                    pz *= fatScaleZ;
                    py *= fatScaleY;

                    vertices.push(px * scale, py * scale * 1.1, pz * scale);

                    const t = (py + 0.7) / 1.4;

                    const color = new THREE.Color();
                    if (t < 0.33) {
                        color.lerpColors(colorPalette[0], colorPalette[1], t * 3);
                    } else if (t < 0.66) {
                        color.lerpColors(colorPalette[1], colorPalette[2], (t - 0.33) * 3);
                    } else {
                        color.lerpColors(colorPalette[2], colorPalette[3], (t - 0.66) * 3);
                    }

                    colors.push(color.r, color.g, color.b);
                }
            }

            for (let i = 0; i < div; i++) {
                for (let j = 0; j < div; j++) {
                    const a = i * (div + 1) + j;
                    const b = i * (div + 1) + j + 1;
                    const c = (i + 1) * (div + 1) + j;
                    const d = (i + 1) * (div + 1) + j + 1;

                    indices.push(a, d, b);
                    indices.push(a, c, d);
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setIndex(indices);
            geometry.computeVertexNormals(true);

            // 蓝血玻璃：透明 + 通透 + 高反射
            const material = new THREE.MeshPhysicalMaterial({
                vertexColors: true,
                emissive: 0x123a8a,
                emissiveIntensity: 0.5,
                roughness: 0.15,
                metalness: 0.0,
                transparent: true,
                opacity: 0.5,
                transmission: 0.4,
                thickness: 0.5,
                ior: 1.5,
                specularIntensity: 1.4,
                specularColor: 0xffffff,
                clearcoat: 1.0,
                clearcoatRoughness: 0.08,
                side: THREE.DoubleSide,
                flatShading: true,
                depthWrite: false,
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = -Math.PI / 2;

            return mesh;
        }

        const heart = createIrregularDiamondHeart();

        // 绕流粒子（绕着爱心体流动，红/蓝/黄）
        const FLOW_COUNT = 2600;
        let flowGeometry = new THREE.BufferGeometry();
        let flowMaterial = new THREE.PointsMaterial({
            size: 0.09,
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            opacity: 1.0,
            sizeAttenuation: true
        });
        let flowSystem = new THREE.Points(flowGeometry, flowMaterial);

        let flowData = [];

        function generateFlowParticles() {
            const positions = new Float32Array(FLOW_COUNT * 3);
            const colors = new Float32Array(FLOW_COUNT * 3);
            const data = [];

            for (let i = 0; i < FLOW_COUNT; i++) {
                // 轨道参数：半径、高度、倾斜、角速度（同向流动）
                const radius = 2.6 + Math.random() * 4.6;
                const y0 = (Math.random() - 0.5) * 3.2;
                const tiltX = (Math.random() - 0.5) * 0.7;
                const tiltZ = (Math.random() - 0.5) * 0.7;
                const angle0 = Math.random() * Math.PI * 2;
                const speed = 0.15 + Math.random() * 0.5;
                const bobAmp = 0.1 + Math.random() * 0.25;
                const bobPhase = Math.random() * Math.PI * 2;

                data.push({ radius, y0, tiltX, tiltZ, angle0, speed, bobAmp, bobPhase });

                // 星辰配色：红 / 蓝 / 黄
                const pick = Math.random();
                let c;
                if (pick < 0.34) {
                    c = new THREE.Color(0xff3b4d);      // 红
                } else if (pick < 0.67) {
                    c = new THREE.Color(0x3f8bff);      // 蓝
                } else {
                    c = new THREE.Color(0xffd23f);      // 黄
                }
                c.multiplyScalar(0.8 + Math.random() * 0.5);

                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;
            }

            return { positions, colors, data };
        }

        function initFlowParticles() {
            const result = generateFlowParticles();
            flowData = result.data;

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(result.positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(result.colors, 3));

            flowGeometry = geo;
            flowSystem = new THREE.Points(geo, flowMaterial);
        }

        initFlowParticles();

        function updateFlowParticles(time) {
            const positions = flowGeometry.attributes.position.array;

            for (let i = 0; i < FLOW_COUNT; i++) {
                const d = flowData[i];
                const a = d.angle0 + time * d.speed;

                let x = d.radius * Math.cos(a);
                let z = d.radius * Math.sin(a);
                let y = d.y0 + Math.sin(time * 0.8 + d.bobPhase) * d.bobAmp;

                // 轨道倾斜：先绕 X 再绕 Z
                const cx = Math.cos(d.tiltX), sx = Math.sin(d.tiltX);
                const cz = Math.cos(d.tiltZ), sz = Math.sin(d.tiltZ);

                const y1 = y * cx - z * sx;
                const z1 = y * sx + z * cx;

                positions[i * 3]     = x * cz + z1 * sz;
                positions[i * 3 + 1] = y1;
                positions[i * 3 + 2] = -x * sz + z1 * cz;
            }

            flowGeometry.attributes.position.needsUpdate = true;
        }

        // 背景星辰（红 / 蓝 / 黄，缓慢闪烁）
        function createStars() {
            const count = 800;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const radius = 4.5 + Math.random() * 6;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);

                positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta) * 0.6 + 0.2;
                positions[i * 3 + 2] = radius * Math.cos(phi);

                const bright = 0.7 + Math.random() * 0.5;
                const pick = Math.random();
                if (pick < 0.34) {
                    colors[i * 3] = bright;
                    colors[i * 3 + 1] = bright * 0.25;
                    colors[i * 3 + 2] = bright * 0.3;      // 红
                } else if (pick < 0.67) {
                    colors[i * 3] = bright * 0.25;
                    colors[i * 3 + 1] = bright * 0.55;
                    colors[i * 3 + 2] = bright;            // 蓝
                } else {
                    colors[i * 3] = bright;
                    colors[i * 3 + 1] = bright * 0.82;
                    colors[i * 3 + 2] = bright * 0.25;     // 黄
                }
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                vertexColors: true,
                size: 0.09,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                opacity: 1.0,
                sizeAttenuation: true
            });

            return new THREE.Points(geometry, material);
        }

        const stars = createStars();
        scene.add(stars);

        const gridHelper = new THREE.GridHelper(8, 16, 0x335577, 0x223344);
        gridHelper.position.y = -2.0;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.12;
        scene.add(gridHelper);

        // 背景冷光，托起爱心
        function createGlowBackdrop() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
            g.addColorStop(0, 'rgba(90, 160, 255, 0.9)');
            g.addColorStop(0.4, 'rgba(60, 90, 230, 0.38)');
            g.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 256, 256);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({
                map: texture,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                opacity: 0.55,
                transparent: true
            });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(11, 11, 1);
            sprite.position.set(0, 0, -3.5);
            return sprite;
        }

        scene.add(createGlowBackdrop());

        // 自旋组：只放爱心（粒子在场景中独立绕流）
        const spinGroup = new THREE.Group();
        spinGroup.add(heart);
        scene.add(spinGroup);

        // 绕流粒子加入场景（不随爱心自旋，独立绕爱心流动）
        scene.add(flowSystem);

        const rotationSpeed = 0.006;
        const BPM = 20;
        let elapsedTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            elapsedTime += 0.016;

            spinGroup.rotation.y += rotationSpeed;
            updateFlowParticles(elapsedTime);
            stars.rotation.y += 0.0001;

            // 背景星辰整体轻微闪烁
            stars.material.opacity = 0.75 + 0.25 * Math.sin(elapsedTime * 0.9);

            const heartPulse = 1 + 0.025 * Math.sin(elapsedTime * (BPM / 60) * Math.PI * 2);
            heart.scale.setScalar(heartPulse);

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
