<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>双色星群 · 粉青分离</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background-color: #120a0f;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            color: #ffffff;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x120a0f);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(4.5, 3.0, 6.5);

        const container = document.getElementById('canvas-container');
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 环境贴图（保留玻璃质感）
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.target.set(0, 0, 0);
        controls.update();

        // ----- 灯光：混合氛围 -----
        scene.add(new THREE.AmbientLight(0xcc99bb, 1.1 * 0.4));

        const mainLight = new THREE.PointLight(0xffddee, 3.2 * 0.4);
        mainLight.position.set(3, 4, 5);
        scene.add(mainLight);

        const pinkLight = new THREE.PointLight(0xff66aa, 2.6 * 0.4);
        pinkLight.position.set(-4, 2, -3);
        scene.add(pinkLight);

        const cyanLight = new THREE.PointLight(0x33ccff, 2.2 * 0.4);
        cyanLight.position.set(0, -3, -5);
        scene.add(cyanLight);

        const topLight = new THREE.DirectionalLight(0xeeddff, 1.1 * 0.4);
        topLight.position.set(0, 5, 0);
        scene.add(topLight);

        scene.add(new THREE.HemisphereLight(0xff88bb, 0x224466, 1.0 * 0.4));

        // ----- 核心爱心：粉青混合渐变 -----
        function createIrregularDiamondHeart() {
            const vertices = [];
            const indices = [];
            const colors = [];
            const scale = 2.4;
            const div = 26;
            const fatScaleX = 0.9;
            const fatScaleZ = 1;
            const fatScaleY = 1.3;

            const colorPalette = [
                new THREE.Color(0x7a1a4a),
                new THREE.Color(0xcc3a7a),
                new THREE.Color(0x66aadd),
                new THREE.Color(0xccf0ff)
            ];

            for (let i = 0; i <= div; i++) {
                const u = (i / div) * Math.PI * 2;
                for (let j = 0; j <= div; j++) {
                    const v = (j / div) * Math.PI;
                    const sinU = Math.sin(u),
                        cosU = Math.cos(u);
                    const sinV = Math.sin(v),
                        cosV = Math.cos(v);

                    const hx = 15 * sinU - 4 * Math.sin(3 * u);
                    const hz = 15 * cosU - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u);

                    let px = sinV * hx / 17;
                    let py = 8 * cosV / 17;
                    let pz = sinV * hz / 17;

                    const jitter = 0.085;
                    const randomFactor = Math.sin(i * 0.7 + j * 1.1) * jitter;
                    px += randomFactor * px;
                    py += randomFactor * py * 0.4;
                    pz += randomFactor * pz;

                    const edgeFactor = Math.pow(Math.abs(sinV), 6);
                    px += edgeFactor * (Math.random() - 0.5) * 0.35;
                    pz += edgeFactor * (Math.random() - 0.5) * 0.35;

                    px *= fatScaleX;
                    pz *= fatScaleZ;
                    py *= fatScaleY;

                    vertices.push(px * scale, py * scale * 1.1, pz * scale);

                    const t = (py + 0.7) / 1.4;
                    const color = new THREE.Color();
                    if (t < 0.33) {
                        color.lerpColors(colorPalette[0], colorPalette[1], t * 3);
                    } else if (t < 0.66) {
                        color.lerpColors(colorPalette[1], colorPalette[2], (t - 0.33) * 3);
                    } else {
                        color.lerpColors(colorPalette[2], colorPalette[3], (t - 0.66) * 3);
                    }
                    colors.push(color.r, color.g, color.b);
                }
            }

            for (let i = 0; i < div; i++) {
                for (let j = 0; j < div; j++) {
                    const a = i * (div + 1) + j;
                    const b = i * (div + 1) + j + 1;
                    const c = (i + 1) * (div + 1) + j;
                    const d = (i + 1) * (div + 1) + j + 1;
                    indices.push(a, d, b);
                    indices.push(a, c, d);
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setIndex(indices);
            geometry.computeVertexNormals(true);

            const material = new THREE.MeshPhysicalMaterial({
                vertexColors: true,
                emissive: 0x883366,
                emissiveIntensity: 0.45 * 0.4,
                roughness: 0.15,
                metalness: 0.0,
                transparent: true,
                opacity: 0.85,
                transmission: 0.4,
                thickness: 0.5,
                ior: 1.5,
                specularIntensity: 1.4,
                specularColor: 0xffffff,
                clearcoat: 1.0,
                clearcoatRoughness: 0.08,
                side: THREE.DoubleSide,
                flatShading: true,
                depthWrite: false,
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = -Math.PI / 2;
            return mesh;
        }

        const heart = createIrregularDiamondHeart();

        // ============================================================
        // 双星群：粉色星群在左侧，青色星群在右侧，互不相交
        // ============================================================
        const PARTICLES_PER_GROUP = 2600;
        const TOTAL_PARTICLES = PARTICLES_PER_GROUP * 2;

        let particleGeometry = new THREE.BufferGeometry();
        let particleMaterial = new THREE.PointsMaterial({
            size: 0.1,
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            opacity: 1.0,
            sizeAttenuation: true
        });
        let particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        let particleData = [];

        function generateSeparatedParticles() {
            const positions = new Float32Array(TOTAL_PARTICLES * 3);
            const colors = new Float32Array(TOTAL_PARTICLES * 3);
            const data = [];

            // ---- 粉色星群：分布在左侧 (X负半轴为主) ----
            for (let i = 0; i < PARTICLES_PER_GROUP; i++) {
                // 球坐标，但偏移到左侧
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                const radius = 3.0 + Math.random() * 6.0;

                // 基础球体位置
                let px = radius * Math.sin(phi) * Math.cos(theta);
                let py = radius * Math.cos(phi) * 0.85;
                let pz = radius * Math.sin(phi) * Math.sin(theta);

                // 向左偏移：X 偏移 -2.5 ~ -5.5
                const xOffset = -(2.5 + Math.random() * 3.5);
                px += xOffset;

                // 轻微压缩，让星群更聚集
                const cloudFactor = 0.7 + Math.random() * 0.5;
                const finalX = px * cloudFactor;
                const finalY = py * cloudFactor * 0.9;
                const finalZ = pz * cloudFactor * 0.9;

                positions[i * 3] = finalX;
                positions[i * 3 + 1] = finalY;
                positions[i * 3 + 2] = finalZ;

                data.push({
                    originX: finalX,
                    originY: finalY,
                    originZ: finalZ,
                    phase: Math.random() * Math.PI * 2,
                    amplitude: 0.12 + Math.random() * 0.2,
                    group: 'pink'
                });

                // 粉色渐变
                const dist = Math.sqrt(finalX * finalX + finalY * finalY + finalZ * finalZ);
                const normDist = Math.min(dist / 10.0, 1.0);
                const r = 0.6 + 0.4 * normDist;
                const g = 0.1 + 0.6 * normDist;
                const b = 0.25 + 0.55 * normDist;
                const variation = 0.85 + Math.random() * 0.3;
                colors[i * 3] = r * variation;
                colors[i * 3 + 1] = g * variation;
                colors[i * 3 + 2] = b * variation;
            }

            // ---- 青色星群：分布在右侧 (X正半轴为主) ----
            for (let i = 0; i < PARTICLES_PER_GROUP; i++) {
                const idx = i + PARTICLES_PER_GROUP;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                const radius = 3.0 + Math.random() * 6.0;

                let px = radius * Math.sin(phi) * Math.cos(theta);
                let py = radius * Math.cos(phi) * 0.85;
                let pz = radius * Math.sin(phi) * Math.sin(theta);

                // 向右偏移：X 偏移 +2.5 ~ +5.5
                const xOffset = 2.5 + Math.random() * 3.5;
                px += xOffset;

                const cloudFactor = 0.7 + Math.random() * 0.5;
                const finalX = px * cloudFactor;
                const finalY = py * cloudFactor * 0.9;
                const finalZ = pz * cloudFactor * 0.9;

                positions[idx * 3] = finalX;
                positions[idx * 3 + 1] = finalY;
                positions[idx * 3 + 2] = finalZ;

                data.push({
                    originX: finalX,
                    originY: finalY,
                    originZ: finalZ,
                    phase: Math.random() * Math.PI * 2,
                    amplitude: 0.12 + Math.random() * 0.2,
                    group: 'cyan'
                });

                // 青色渐变
                const dist = Math.sqrt(finalX * finalX + finalY * finalY + finalZ * finalZ);
                const normDist = Math.min(dist / 10.0, 1.0);
                const r = 0.0 + 0.7 * normDist;
                const g = 0.5 + 0.4 * normDist;
                const b = 0.7 + 0.3 * normDist;
                const variation = 0.85 + Math.random() * 0.3;
                colors[idx * 3] = r * variation;
                colors[idx * 3 + 1] = g * variation;
                colors[idx * 3 + 2] = b * variation;
            }

            return { positions, colors, data };
        }

        function initParticles() {
            const result = generateSeparatedParticles();
            particleData = result.data;
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(result.positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(result.colors, 3));
            particleGeometry = geo;
            particleSystem = new THREE.Points(geo, particleMaterial);
        }
        initParticles();

        // ----- 背景星星 -----
        function createStars() {
            const count = 600;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const radius = 5.0 + Math.random() * 8.0;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);

                positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta) * 0.5 + 0.2;
                positions[i * 3 + 2] = radius * Math.cos(phi);

                const bright = (0.3 + Math.random() * 0.4) * 0.5;
                const tint = Math.random();
                if (tint < 0.5) {
                    colors[i * 3] = bright;
                    colors[i * 3 + 1] = bright * 0.5;
                    colors[i * 3 + 2] = bright * 0.6;
                } else {
                    colors[i * 3] = bright * 0.3;
                    colors[i * 3 + 1] = bright * 0.7;
                    colors[i * 3 + 2] = bright;
                }
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                vertexColors: true,
                size: 0.08,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                opacity: 1.0,
                sizeAttenuation: true
            });

            return new THREE.Points(geometry, material);
        }

        const stars = createStars();
        scene.add(stars);

        // ----- 辅助元素（网格）-----
        const gridHelper = new THREE.GridHelper(12, 20, 0x553366, 0x334466);
        gridHelper.position.y = -2.2;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.05;
        scene.add(gridHelper);

        // ----- 组合场景 -----
        const spinGroup = new THREE.Group();
        spinGroup.add(heart);
        spinGroup.add(particleSystem);
        scene.add(spinGroup);

        const rotationSpeed = 0.006;
        const BPM = 20;
        let elapsedTime = 0;

        // ----- 粒子呼吸更新 -----
        function updateParticles(time) {
            const positions = particleGeometry.attributes.position.array;
            const heartPhase = time * (BPM / 60) * Math.PI * 2;
            let pulseFactor = 1 + 0.10 * Math.sin(heartPhase) * 0.6 + 0.05 * Math.sin(heartPhase * 2 + 0.5);

            for (let i = 0; i < TOTAL_PARTICLES; i++) {
                const data = particleData[i];
                const individualPhase = data.phase + time * 0.18;
                const individualPulse = 1 + 0.12 * Math.sin(individualPhase) * data.amplitude;
                const combinedPulse = (pulseFactor + individualPulse * 0.3) / 1.3;
                const scaleFactor = combinedPulse;

                positions[i * 3] = data.originX * scaleFactor;
                positions[i * 3 + 1] = data.originY * scaleFactor;
                positions[i * 3 + 2] = data.originZ * scaleFactor;
            }
            particleGeometry.attributes.position.needsUpdate = true;

            const sizePulse = 0.1 + 0.02 * (pulseFactor - 0.9) * 2;
            particleMaterial.size = THREE.MathUtils.clamp(sizePulse, 0.07, 0.14);
        }

        // ----- 动画循环 -----
        function animate() {
            requestAnimationFrame(animate);
            elapsedTime += 0.016;

            spinGroup.rotation.y += rotationSpeed;
            updateParticles(elapsedTime);
            stars.rotation.y += 0.0001;

            const heartPulse = 1 + 0.025 * Math.sin(elapsedTime * (BPM / 60) * Math.PI * 2);
            heart.scale.setScalar(heartPulse);

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
