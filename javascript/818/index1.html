<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>立体爱心 · 呼吸式粒子</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background-color: #0a0a1a;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            color: #ffffff;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #header {
            position: fixed;
            top: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        #header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #ff4d8a;
            text-shadow: 0 0 30px rgba(255, 77, 138, 0.4);
            letter-spacing: 2px;
        }
        #header .subtitle {
            margin-top: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 4px;
            font-weight: 300;
        }
        #info-panel {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(10, 10, 30, 0.7);
            padding: 12px 24px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 20px;
            pointer-events: none;
        }
        #info-panel .heart-beat {
            display: inline-block;
            color: #ff4d8a;
            font-size: 20px;
            animation: heartbeat 1.2s ease-in-out infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.2); }
            70% { transform: scale(1); }
        }
        #info-panel .label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            letter-spacing: 2px;
        }
        #info-panel .status {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }
        #footer {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        #footer p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
        }
        #footer .highlight {
            color: #ff4d8a;
        }
        @media (max-width: 768px) {
            #header h1 { font-size: 22px; }
            #header .subtitle { font-size: 12px; }
            #info-panel { bottom: 80px; padding: 10px 16px; gap: 12px; }
            #info-panel .label { font-size: 11px; }
            #info-panel .status { font-size: 11px; }
            #footer p { font-size: 11px; }
        }
        @media (max-width: 480px) {
            #header { top: 20px; }
            #header h1 { font-size: 18px; }
            #header .subtitle { font-size: 10px; }
            #info-panel { bottom: 70px; padding: 8px 12px; gap: 8px; flex-wrap: wrap; justify-content: center; }
            #info-panel .label { font-size: 10px; }
            #info-panel .status { font-size: 10px; }
            #footer { bottom: 20px; }
            #footer p { font-size: 10px; }
        }
    </style>
</head>
<body>
    <header id="header">
        <h1>❤️ 立体爱心</h1>
        <p class="subtitle">呼吸式粒子 · 柔和脉动</p>
    </header>

    <div id="canvas-container"></div>

    <div id="info-panel">
        <span class="heart-beat">❤️</span>
        <span class="label">粒子模式</span>
        <span class="status">💖 呼吸式</span>
        <span class="label">·</span>
        <span class="status" id="bpm-display">BPM: 72</span>
        <span class="label">·</span>
        <span class="status" style="color: rgba(255,255,255,0.3); font-size: 11px;">柔和脉动</span>
    </div>

    <footer id="footer">
        <p><span class="highlight">❤️</span> 拖拽旋转 · 滚轮缩放 · 粒子轻柔呼吸 <span class="highlight">❤️</span></p>
    </footer>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ----- 场景设置 -----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        // const amplitude = 0.15 + Math.random() * 0.2
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(3.5, 2.5, 5.5);

        const container = document.getElementById('canvas-container');
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.target.set(0, 0, 0);
        controls.update();

        // ----- 灯光 -----const rotationSpeed = 0.01;
        scene.add(new THREE.AmbientLight(0x404060, 0.5));
        const mainLight = new THREE.PointLight(0xff4d6d, 2.0);
        mainLight.position.set(3, 4, 5);
        scene.add(mainLight);
        const fillLight = new THREE.PointLight(0x4ecdc4, 1.0);
        fillLight.position.set(-4, 2, -3);
        scene.add(fillLight);
        const backLight = new THREE.PointLight(0xaa88ff, 0.8);
        backLight.position.set(0, -3, -5);
        scene.add(backLight);
        const topLight = new THREE.DirectionalLight(0xffaa88, 0.4);
        topLight.position.set(0, 5, 0);
        scene.add(topLight);

        // const heartPhase = time * (bpm / 60) * Math.PI * 2;
        // ----- 创建爱心 -----
        function createHeart() {
            const segments = 64;
            const vertices = [];
            const indices = [];
            const colors = [];
            const scale = 2.4;

            for (let i = 0; i <= segments; i++) {
                const u = (i / segments) * Math.PI * 2;
                for (let j = 0; j <= segments; j++) {
                    const v = (j / segments) * Math.PI;
                    const sinU = Math.sin(u);
                    const cosU = Math.cos(u);
                    const sinV = Math.sin(v);
                    const cosV = Math.cos(v);
                    const heartX2d = 15 * sinU - 4 * Math.sin(3 * u);
                    const heartZ2d = 15 * cosU - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u);
                    const px = sinV * heartX2d / 17;
                    const py = 8 * cosV / 17;
                    const pz = sinV * heartZ2d / 17;
                    vertices.push(px * scale, py * scale * 1.1, pz * scale);
                    const normY = (py + 0.7) / 1.4;
                    const r = 0.85 + 0.15 * (1 - normY);
                    const g = 0.1 + 0.3 * (1 - normY) * 0.5;
                    const b = 0.2 + 0.6 * normY;
                    colors.push(r, g * 0.7, b * 0.85);
                }
            }

            for (let i = 0; i < segments; i++) {
                for (let j = 0; j < segments; j++) {
                    const a = i * (segments + 1) + j;
                    const b = i * (segments + 1) + j + 1;
                    const c = (i + 1) * (segments + 1) + j;
                    const d = (i + 1) * (segments + 1) + j + 1;
                    indices.push(a, b, c);
                    indices.push(b, d, c);
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setIndex(indices);
            geometry.computeVertexNormals();

            const material = new THREE.MeshPhongMaterial({
                vertexColors: true,
                emissive: 0x3a1020,
                emissiveIntensity: 0.25,
                shininess: 40,
                transparent: true,
                opacity: 0.92,
                side: THREE.DoubleSide,
                specular: 0x442233,
                flatShading: false
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = -Math.PI / 2;
            return mesh;
        }

        const heart = createHeart();
        scene.add(heart);

        // ----- 💖 呼吸式粒子系统 -----bpm
        const PARTICLE_COUNT = 5000;
        let particleGeometry = new THREE.BufferGeometry();
        let particleMaterial = new THREE.PointsMaterial({
            size: 0.08,
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            opacity: 0.9,
            sizeAttenuation: true
        });
        let particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particleSystem);

        // 存储每个粒子的初始位置和相位
        let particleData = [];

        function generateParticles() {
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    const data = [];

    const c1 = new THREE.Color(0xff4d8a);
    const c2 = new THREE.Color(0x4ecdc4);
    const c3 = new THREE.Color(0xaa88ff);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        // ⭐ 球形分布 - 范围扩大到三倍
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        const radius = 3.6 + Math.random() * 8.4;  // ✅ 改为三倍范围
        
        const px = radius * Math.sin(phi) * Math.cos(theta);
        const py = radius * Math.cos(phi) * 0.85;
        const pz = radius * Math.sin(phi) * Math.sin(theta);

        const cloudFactor = 0.8 + Math.random() * 0.4;
        const finalX = px * cloudFactor;
        const finalY = py * cloudFactor;
        const finalZ = pz * cloudFactor;

        positions[i*3] = finalX;
        positions[i*3+1] = finalY;
        positions[i*3+2] = finalZ;

        data.push({
            originX: finalX,
            originY: finalY,
            originZ: finalZ,
            phase: Math.random() * Math.PI * 2,
            amplitude: 0.15 + Math.random() * 0.2,
            delay: Math.random() * 0.5,
            theta: theta,
            phi: phi,
            radius: radius
        });

        // 颜色（根据距离中心远近渐变）
        const dist = Math.sqrt(finalX*finalX + finalY*finalY + finalZ*finalZ);
        const normDist = Math.min(dist / 12.0, 1.0);  // ✅ 调整最大距离到 12.0
        
        let mixCol;
        const rand = Math.random();
        if (rand < 0.4) {
            mixCol = new THREE.Color(0xff4d8a).lerp(new THREE.Color(0x4ecdc4), Math.random());
        } else if (rand < 0.7) {
            mixCol = new THREE.Color(0x4ecdc4).lerp(new THREE.Color(0xaa88ff), Math.random());
        } else {
            mixCol = new THREE.Color(0xaa88ff).lerp(new THREE.Color(0xff4d8a), Math.random());
        }
        
        // 根据距离调整亮度：内部亮，外部稍暗
        const brightness = 0.7 + 0.3 * (1 - normDist);
        mixCol.multiplyScalar(brightness);
        
        colors[i*3] = mixCol.r;
        colors[i*3+1] = mixCol.g;
        colors[i*3+2] = mixCol.b;
    }

    return { positions, colors, data };
}

        // 初始化粒子console.log('💖 初始化粒子系统...');
        function initParticles() {
            const result = generateParticles();
            particleData = result.data;

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(result.positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(result.colors, 3));

            scene.remove(particleSystem);
            particleGeometry = geo;
            particleSystem = new THREE.Points(geo, particleMaterial);
            scene.add(particleSystem);
        }

        initParticles();

        // ----- 💖 呼吸动画更新 -----
        let breathTime = 0;
        const bpm = 20; // 心跳频率（每分钟）

        function updateParticles(time) {
            const positions = particleGeometry.attributes.position.array;

            // 心跳波形
            const heartPhase = time * (bpm / 60) * Math.PI * 2;
            
            // 心跳脉冲
            let pulseFactor = 1 + 0.12 * Math.sin(heartPhase) * 0.6 + 0.06 * Math.sin(heartPhase * 2 + 0.5);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const data = particleData[i];
                if (!data) continue;

                // 每个粒子有微小的相位偏移
                const individualPhase = data.phase + time * 0.2;
                const individualPulse = 1 + 0.15 * Math.sin(individualPhase) * data.amplitude;

                // 综合呼吸效果
                const combinedPulse = (pulseFactor + individualPulse * 0.3) / 1.3;

                // 应用呼吸
                const scaleFactor = combinedPulse;
                
                positions[i*3] = data.originX * scaleFactor;
                positions[i*3+1] = data.originY * scaleFactor;
                positions[i*3+2] = data.originZ * scaleFactor;
            }

            particleGeometry.attributes.position.needsUpdate = true;

            // 粒子大小随呼吸微变（更柔和）
            const sizePulse = 0.075 + 0.015 * (pulseFactor - 0.9) * 2;
            particleMaterial.size = Math.max(0.05, Math.min(0.10, sizePulse));
        }

        // ----- 装饰环 -----
        function createRings() {
            const rings = [];
            const configs = [
                { color: 0xff4d8a, radius: 2.8, opacity: 0.08, rotX: Math.PI / 2.3, rotZ: 0.3 },
                { color: 0x4ecdc4, radius: 3.2, opacity: 0.06, rotX: 0.7, rotY: 0.5 },
                { color: 0xaa88ff, radius: 2.4, opacity: 0.07, rotX: 1.1, rotY: 0.2 }
            ];
            configs.forEach((cfg) => {
                const mat = new THREE.MeshBasicMaterial({
                    color: cfg.color,
                    transparent: true,
                    opacity: cfg.opacity,
                    side: THREE.DoubleSide
                });
                const ring = new THREE.Mesh(new THREE.TorusGeometry(cfg.radius, 0.01, 16, 48), mat);
                if (cfg.rotX) ring.rotation.x = cfg.rotX;
                if (cfg.rotY) ring.rotation.y = cfg.rotY;
                if (cfg.rotZ) ring.rotation.z = cfg.rotZ;
                rings.push(ring);
            });
            return rings;
        }

        const rings = createRings();
        rings.forEach(ring => scene.add(ring));

        // ----- 星点背景 -----
        function createStars() {
            const count = 400;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                const radius = 4.5 + Math.random() * 5;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                positions[i*3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i*3+1] = radius * Math.sin(phi) * Math.sin(theta) * 0.6 + 0.2;
                positions[i*3+2] = radius * Math.cos(phi);
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({
                color: 0x88aaff,
                size: 0.05,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                opacity: 0.4,
                sizeAttenuation: true
            });
            return new THREE.Points(geometry, material);
        }

        const stars = createStars();
        scene.add(stars);

        // 网格
        const gridHelper = new THREE.GridHelper(8, 16, 0x446688, 0x223344);
        gridHelper.position.y = -2.0;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.12;
        scene.add(gridHelper);

        // ----- 自旋组 -----
        const spinGroup = new THREE.Group();
        scene.remove(heart);
        scene.remove(particleSystem);
        rings.forEach(ring => scene.remove(ring));

        spinGroup.add(heart);
        spinGroup.add(particleSystem);
        rings.forEach(ring => spinGroup.add(ring));

        scene.add(spinGroup);

        // ----- BPM 显示更新 -----
        function updateBPMDisplay() {
            const display = document.getElementById('bpm-display');
            if (display) {
                display.textContent = `BPM: ${bpm}`;
            }
        }
        updateBPMDisplay();

        // ----- 动画循环 -----
        const rotationSpeed = 0.008; // 自旋速度
        let elapsedTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            elapsedTime += 0.016;

            // 自旋
            spinGroup.rotation.y += rotationSpeed;

            // 💖 更新粒子呼吸
            updateParticles(elapsedTime);

            // 星点背景
            stars.rotation.y += 0.0001;

            // 爱心脉动（更柔和）
            const heartPulse = 1 + 0.002 * Math.sin(elapsedTime * (bpm / 60) * Math.PI * 2);
            heart.scale.set(heartPulse, heartPulse, heartPulse);

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

        console.log('💖 呼吸式粒子已启动 | BPM: 72 | 柔和脉动模式');
    </script>
</body>
</html>
