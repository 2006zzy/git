<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>双心星辰 · 轨迹留痕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background-color: #0b0710;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            color: #ffffff;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .info {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            letter-spacing: 2px;
            pointer-events: none;
            text-shadow: 0 0 12px rgba(0,0,0,0.7);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="info">✦ 鸿蒙生两仪，此心终不移 ✦</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        // --- 初始化场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0710);

        const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
        // 相机位置需要拉远以适应5倍轨迹
        camera.position.set(28, 16, 40);
        camera.lookAt(0, 0, 0);

        const container = document.getElementById('canvas-container');
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.06).texture;

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.autoRotate = false;
        controls.target.set(0, 0, 0);
        controls.update();

        // --- 灯光 ---
        scene.add(new THREE.AmbientLight(0x8899bb, 1.2 * 0.6));

        const mainLight = new THREE.DirectionalLight(0xffeef8, 2.0 * 0.6);
        mainLight.position.set(2, 5, 6);
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x88ccff, 1.6 * 0.6);
        fillLight.position.set(-4, 1, -3);
        scene.add(fillLight);

        const backLight = new THREE.DirectionalLight(0xff99bb, 1.4 * 0.6);
        backLight.position.set(-1, -2, -6);
        scene.add(backLight);

        scene.add(new THREE.HemisphereLight(0x88bbff, 0x331122, 0.9 * 0.6));

        // --- 工具函数：创建爱心 ---
        function createHeart(style = 'cyan') {
            const vertices = [];
            const indices = [];
            const colors = [];
            const scale = 2.2;
            const div = 26;
            const fatScaleX = 0.9;
            const fatScaleZ = 1.0;
            const fatScaleY = 1.3;

            let colorPalette;
            if (style === 'cyan') {
                colorPalette = [
                    new THREE.Color(0x1a5fa8),
                    new THREE.Color(0x3fa9ff),
                    new THREE.Color(0x66e0ff),
                    new THREE.Color(0xeefaff)
                ];
            } else {
                colorPalette = [
                    new THREE.Color(0x7a1a3a),
                    new THREE.Color(0xcc3a6a),
                    new THREE.Color(0xff6699),
                    new THREE.Color(0xffd0dd)
                ];
            }

            for (let i = 0; i <= div; i++) {
                const u = (i / div) * Math.PI * 2;
                for (let j = 0; j <= div; j++) {
                    const v = (j / div) * Math.PI;
                    const sinU = Math.sin(u), cosU = Math.cos(u);
                    const sinV = Math.sin(v), cosV = Math.cos(v);

                    const hx = 15 * sinU - 4 * Math.sin(3 * u);
                    const hz = 15 * cosU - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u);

                    let px = sinV * hx / 17;
                    let py = 8 * cosV / 17;
                    let pz = sinV * hz / 17;

                    const jitter = 0.085;
                    const randomFactor = Math.sin(i * 0.7 + j * 1.1) * jitter;
                    px += randomFactor * px;
                    py += randomFactor * py * 0.4;
                    pz += randomFactor * pz;

                    const edgeFactor = Math.pow(Math.abs(sinV), 6);
                    px += edgeFactor * (Math.random() - 0.5) * 0.35;
                    pz += edgeFactor * (Math.random() - 0.5) * 0.35;

                    px *= fatScaleX;
                    pz *= fatScaleZ;
                    py *= fatScaleY;

                    vertices.push(px * scale, py * scale * 1.1, pz * scale);

                    const t = (py + 0.7) / 1.4;
                    const color = new THREE.Color();
                    if (t < 0.33) {
                        color.lerpColors(colorPalette[0], colorPalette[1], t * 3);
                    } else if (t < 0.66) {
                        color.lerpColors(colorPalette[1], colorPalette[2], (t - 0.33) * 3);
                    } else {
                        color.lerpColors(colorPalette[2], colorPalette[3], (t - 0.66) * 3);
                    }
                    colors.push(color.r, color.g, color.b);
                }
            }

            for (let i = 0; i < div; i++) {
                for (let j = 0; j < div; j++) {
                    const a = i * (div + 1) + j;
                    const b = i * (div + 1) + j + 1;
                    const c = (i + 1) * (div + 1) + j;
                    const d = (i + 1) * (div + 1) + j + 1;
                    indices.push(a, d, b);
                    indices.push(a, c, d);
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setIndex(indices);
            geometry.computeVertexNormals(true);

            const emissiveColor = style === 'cyan' ? 0x1a6ad8 : 0xaa3366;
            const material = new THREE.MeshPhysicalMaterial({
                vertexColors: true,
                emissive: emissiveColor,
                emissiveIntensity: 0.45 * 0.5,
                roughness: 0.15,
                metalness: 0.0,
                transparent: true,
                opacity: 0.88,
                transmission: 0.35,
                thickness: 0.5,
                ior: 1.5,
                specularIntensity: 1.3,
                specularColor: 0xffffff,
                clearcoat: 1.0,
                clearcoatRoughness: 0.08,
                side: THREE.DoubleSide,
                flatShading: true,
                depthWrite: false,
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = -Math.PI / 2;
            return mesh;
        }

        // --- 创建两个爱心 ---
        const heartCyan = createHeart('cyan');
        const heartPink = createHeart('pink');

        // --- 创建星群粒子 ---
        function createParticleSystem(count, colorStyle, radiusMin = 3.0, radiusMax = 8.0) {
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const data = [];

            for (let i = 0; i < count; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                const radius = radiusMin + Math.random() * (radiusMax - radiusMin);

                let px = radius * Math.sin(phi) * Math.cos(theta);
                let py = radius * Math.cos(phi) * 0.85;
                let pz = radius * Math.sin(phi) * Math.sin(theta);

                const cloudFactor = 0.85 + Math.random() * 0.3;
                px *= cloudFactor;
                py *= cloudFactor;
                pz *= cloudFactor;

                positions[i * 3] = px;
                positions[i * 3 + 1] = py;
                positions[i * 3 + 2] = pz;

                data.push({
                    originX: px,
                    originY: py,
                    originZ: pz,
                    phase: Math.random() * Math.PI * 2,
                    amplitude: 0.12 + Math.random() * 0.2
                });

                const dist = Math.sqrt(px * px + py * py + pz * pz);
                const normDist = Math.min(dist / 12.0, 1.0);

                let r, g, b;
                if (colorStyle === 'cyan') {
                    r = 0.0 + 0.8 * normDist;
                    g = 0.6 + 0.4 * normDist;
                    b = 0.8 + 0.2 * normDist;
                } else {
                    r = 0.6 + 0.4 * normDist;
                    g = 0.1 + 0.7 * normDist;
                    b = 0.25 + 0.65 * normDist;
                }
                const variation = 0.85 + Math.random() * 0.3;
                colors[i * 3] = r * variation;
                colors[i * 3 + 1] = g * variation;
                colors[i * 3 + 2] = b * variation;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.095,
                vertexColors: true,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                opacity: 1.0,
                sizeAttenuation: true
            });

            const points = new THREE.Points(geometry, material);
            points.userData = { data, geometry, material };
            return points;
        }

        const particleCyan = createParticleSystem(4800, 'cyan', 3.0, 8.2);
        const particlePink = createParticleSystem(4800, 'pink', 3.0, 8.2);

        // --- 背景星星 ---
        function createBackgroundStars() {
            const count = 1200;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const radius = 30 + Math.random() * 40;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = radius * Math.cos(phi) * 0.6;
                positions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);

                const bright = (0.3 + Math.random() * 0.5) * 0.6;
                const tint = Math.random();
                if (tint < 0.4) {
                    colors[i * 3] = bright * 0.8;
                    colors[i * 3 + 1] = bright * 0.9;
                    colors[i * 3 + 2] = bright;
                } else if (tint < 0.7) {
                    colors[i * 3] = bright;
                    colors[i * 3 + 1] = bright * 0.7;
                    colors[i * 3 + 2] = bright * 0.8;
                } else {
                    colors[i * 3] = bright * 0.9;
                    colors[i * 3 + 1] = bright * 0.6;
                    colors[i * 3 + 2] = bright * 0.7;
                }
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                vertexColors: true,
                size: 0.08,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                opacity: 0.8,
                sizeAttenuation: true
            });
            return new THREE.Points(geometry, material);
        }
        const bgStars = createBackgroundStars();
        scene.add(bgStars);

        // --- 构建双星系统 ---
        const groupCyan = new THREE.Group();
        groupCyan.add(heartCyan);
        groupCyan.add(particleCyan);
        scene.add(groupCyan);

        const groupPink = new THREE.Group();
        groupPink.add(heartPink);
        groupPink.add(particlePink);
        scene.add(groupPink);

        // --- 位置设定 ---
        const separation = 7.2;
        groupCyan.position.x = -separation / 2;
        groupPink.position.x = separation / 2;
        groupCyan.position.y = 0.2;
        groupPink.position.y = -0.2;

        // --- 母组：用于整体椭圆轨道运动 ---
        const masterGroup = new THREE.Group();
        scene.remove(groupCyan);
        scene.remove(groupPink);
        masterGroup.add(groupCyan);
        masterGroup.add(groupPink);
        scene.add(masterGroup);

        // --- 椭圆轨迹参数 ---
        const orbitA = 6.5;
        const orbitB = 4.0;
        // 轨迹缩放系数 = 5（最大运动轨迹为原来的5倍）
        const orbitScale = 5;
        let orbitAngle = 0;
        const orbitSpeed = 0.003;

        // ============================================================
        // 1. 增强轨迹线：主轨 + 发光轨 + 虚线轨
        // ============================================================
        function createOrbitLines() {
            const group = new THREE.Group();
            const segments = 180;

            // 主轨 - 亮蓝色发光
            const pts1 = [];
            for (let i = 0; i <= segments; i++) {
                const t = (i / segments) * Math.PI * 2;
                pts1.push(new THREE.Vector3(orbitScale * orbitA * Math.cos(t), 0, orbitScale * orbitB * Math.sin(t)));
            }
            const geo1 = new THREE.BufferGeometry().setFromPoints(pts1);
            const mat1 = new THREE.LineBasicMaterial({
                color: 0x44ccff,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending,
            });
            const line1 = new THREE.Line(geo1, mat1);
            group.add(line1);

            // 副轨 - 粉紫色发光
            const pts2 = [];
            for (let i = 0; i <= segments; i++) {
                const t = (i / segments) * Math.PI * 2;
                pts2.push(new THREE.Vector3(orbitScale * orbitA * Math.cos(t), -0.15, orbitScale * orbitB * Math.sin(t)));
            }
            const geo2 = new THREE.BufferGeometry().setFromPoints(pts2);
            const mat2 = new THREE.LineBasicMaterial({
                color: 0xff66aa,
                transparent: true,
                opacity: 0.3,
                blending: THREE.AdditiveBlending,
            });
            const line2 = new THREE.Line(geo2, mat2);
            group.add(line2);

            // 第三轨 - 光晕点阵
            const glowPts = [];
            const glowCount = 120;
            for (let i = 0; i < glowCount; i++) {
                const t = (i / glowCount) * Math.PI * 2;
                const x = orbitScale * orbitA * Math.cos(t);
                const z = orbitScale * orbitB * Math.sin(t);
                glowPts.push(x, 0, z);
            }
            const glowGeo = new THREE.BufferGeometry();
            glowGeo.setAttribute('position', new THREE.Float32BufferAttribute(glowPts, 3));
            const glowMat = new THREE.PointsMaterial({
                color: 0x88ddff,
                size: 0.12,
                transparent: true,
                opacity: 0.5,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true,
                depthWrite: false,
            });
            const glowPoints = new THREE.Points(glowGeo, glowMat);
            group.add(glowPoints);

            // 小光点标记
            const markerMat = new THREE.PointsMaterial({
                color: 0xaaddff,
                size: 0.18,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true,
                depthWrite: false,
            });
            const markerPositions = [];
            const markerCount = 24;
            for (let i = 0; i < markerCount; i++) {
                const t = (i / markerCount) * Math.PI * 2 + 0.1;
                const x = orbitScale * orbitA * Math.cos(t);
                const z = orbitScale * orbitB * Math.sin(t);
                markerPositions.push(x, 0, z);
            }
            const markerGeo = new THREE.BufferGeometry();
            markerGeo.setAttribute('position', new THREE.Float32BufferAttribute(markerPositions, 3));
            const markerPoints = new THREE.Points(markerGeo, markerMat);
            group.add(markerPoints);

            return group;
        }

        const orbitLinesGroup = createOrbitLines();
        scene.add(orbitLinesGroup);

        // ============================================================
        // 2. 动态拖尾粒子系统 - 沿着轨迹留下光痕
        // ============================================================
        const TRAIL_COUNT = 120;  // 增加拖尾粒子数量以适应更大的轨迹
        const trailPositions = new Float32Array(TRAIL_COUNT * 3);
        const trailOpacities = new Float32Array(TRAIL_COUNT);
        const trailSizes = new Float32Array(TRAIL_COUNT);

        const MAX_HISTORY = 200;  // 增加历史记录长度

        for (let i = 0; i < TRAIL_COUNT; i++) {
            trailOpacities[i] = 0;
            trailSizes[i] = 0.05 + Math.random() * 0.08;
            trailPositions[i * 3] = 0;
            trailPositions[i * 3 + 1] = 0;
            trailPositions[i * 3 + 2] = 0;
        }

        const trailGeo = new THREE.BufferGeometry();
        trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
        trailGeo.setAttribute('opacity', new THREE.BufferAttribute(trailOpacities, 1));
        trailGeo.setAttribute('size', new THREE.BufferAttribute(trailSizes, 1));

        const trailMat = new THREE.PointsMaterial({
            color: 0x88ddff,
            size: 0.25,
            transparent: true,
            blending: THREE.AdditiveBlending,
            sizeAttenuation: true,
            depthWrite: false,
            opacity: 0.6,
        });
        const trailPoints = new THREE.Points(trailGeo, trailMat);
        scene.add(trailPoints);

        // 双色拖尾：再创建一个粉色的
        const trailPositions2 = new Float32Array(TRAIL_COUNT * 3);
        const trailOpacities2 = new Float32Array(TRAIL_COUNT);
        const trailSizes2 = new Float32Array(TRAIL_COUNT);
        for (let i = 0; i < TRAIL_COUNT; i++) {
            trailOpacities2[i] = 0;
            trailSizes2[i] = 0.05 + Math.random() * 0.08;
            trailPositions2[i * 3] = 0;
            trailPositions2[i * 3 + 1] = 0;
            trailPositions2[i * 3 + 2] = 0;
        }
        const trailGeo2 = new THREE.BufferGeometry();
        trailGeo2.setAttribute('position', new THREE.BufferAttribute(trailPositions2, 3));
        trailGeo2.setAttribute('opacity', new THREE.BufferAttribute(trailOpacities2, 1));
        trailGeo2.setAttribute('size', new THREE.BufferAttribute(trailSizes2, 1));
        const trailMat2 = new THREE.PointsMaterial({
            color: 0xff66aa,
            size: 0.25,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending,
            sizeAttenuation: true,
            depthWrite: false,
        });
        const trailPoints2 = new THREE.Points(trailGeo2, trailMat2);
        scene.add(trailPoints2);

        // 记录历史位置用于拖尾
        const posHistory = [];
        const posHistory2 = [];

        // --- 辅助网格 ---
        const gridHelper = new THREE.GridHelper(70, 20, 0x446688, 0x224466);
        gridHelper.position.y = -2.8;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.06;
        scene.add(gridHelper);

        // --- 动画状态 ---
        const rotationSpeedSelf = 0.006;
        const rotationSpeedOrbit = 0.0035;
        let elapsedTime = 0;
        const BPM = 50;

        // --- 粒子更新函数 ---
        function updateParticles(group, time, pulseOffset = 0) {
            const points = group.children.find(child => child.isPoints);
            if (!points) return;
            const geometry = points.geometry;
            const positions = geometry.attributes.position.array;
            const data = points.userData.data;
            if (!data) return;

            const heartPhase = time * (BPM / 50) * Math.PI * 2 + pulseOffset;
            let pulseFactor = 1 + 0.2 * Math.sin(heartPhase) * 0.6 + 0.06 * Math.sin(heartPhase * 1.5 + 0.5);

            for (let i = 0; i < data.length; i++) {
                const d = data[i];
                const individualPhase = d.phase + time * 0.22;
                const individualPulse = 1 + 0.15 * Math.sin(individualPhase) * d.amplitude;
                const combinedPulse = (pulseFactor + individualPulse * 0.3) / 1.3;
                const scaleFactor = combinedPulse;

                positions[i * 3] = d.originX * scaleFactor;
                positions[i * 3 + 1] = d.originY * scaleFactor;
                positions[i * 3 + 2] = d.originZ * scaleFactor;
            }
            geometry.attributes.position.needsUpdate = true;

            const sizePulse = 0.095 + 0.02 * (pulseFactor - 0.9) * 2;
            points.material.size = THREE.MathUtils.clamp(sizePulse, 0.07, 0.14);
        }

        // --- 更新拖尾粒子 ---
        function updateTrail(history, trailGeo, trailPos, trailOpac, trailSizes, color) {
            const count = history.length;
            const posAttr = trailGeo.attributes.position;
            const opacAttr = trailGeo.attributes.opacity;

            for (let i = 0; i < TRAIL_COUNT; i++) {
                if (i < count) {
                    const idx = count - 1 - i;
                    const p = history[idx];
                    trailPos[i * 3] = p.x;
                    trailPos[i * 3 + 1] = 0 + 0.05 * Math.sin(i * 0.5 + elapsedTime);
                    trailPos[i * 3 + 2] = p.z;
                    const alpha = Math.pow(1 - i / TRAIL_COUNT, 1.5) * 0.9;
                    trailOpac[i] = alpha;
                    trailSizes[i] = 0.04 + alpha * 0.18;
                } else {
                    trailPos[i * 3] = 0;
                    trailPos[i * 3 + 1] = 0;
                    trailPos[i * 3 + 2] = 0;
                    trailOpac[i] = 0;
                    trailSizes[i] = 0.02;
                }
            }

            posAttr.needsUpdate = true;
            opacAttr.needsUpdate = true;
            const sizeAttr = trailGeo.attributes.size;
            if (sizeAttr) {
                sizeAttr.needsUpdate = true;
            }
        }

        // --- 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);
            elapsedTime += 0.016;

            // === 椭圆轨道运动 ===
            orbitAngle += orbitSpeed * 6;
            const x = orbitScale * orbitA * Math.cos(orbitAngle);
            const z = orbitScale * orbitB * Math.sin(orbitAngle);
            masterGroup.position.x = x;
            masterGroup.position.z = z;
            masterGroup.position.y = 0.15 * Math.sin(orbitAngle * 0.7);

            // --- 记录轨迹历史 ---
            posHistory.push({ x: x, z: z });
            if (posHistory.length > MAX_HISTORY) posHistory.shift();

            // 粉色拖尾稍微偏移
            const offsetAngle = 0.3;
            const x2 = orbitScale * orbitA * Math.cos(orbitAngle + offsetAngle);
            const z2 = orbitScale * orbitB * Math.sin(orbitAngle + offsetAngle);
            posHistory2.push({ x: x2, z: z2 });
            if (posHistory2.length > MAX_HISTORY) posHistory2.shift();

            // --- 更新拖尾粒子 ---
            updateTrail(posHistory, trailGeo, trailPositions, trailOpacities, trailSizes, 'cyan');
            updateTrail(posHistory2, trailGeo2, trailPositions2, trailOpacities2, trailSizes2, 'pink');

            // 母组自身绕Y轴旋转
            masterGroup.rotation.y += rotationSpeedOrbit * 5;

            // 每个星群自转
            groupCyan.rotation.y += rotationSpeedSelf * 0.8;
            groupPink.rotation.y += rotationSpeedSelf * 0.8;

            // 爱心脉冲
            const heartPulse = 1 + 0.001 * Math.sin(elapsedTime * (BPM / 50) * Math.PI * 2);
            heartCyan.scale.setScalar(heartPulse);
            heartPink.scale.setScalar(heartPulse);

            // 更新粒子
            updateParticles(groupCyan, elapsedTime, 0);
            updateParticles(groupPink, elapsedTime, 1.2);

            // 背景星星
            bgStars.rotation.y += 0.00015;
            bgStars.rotation.x += 0.00005;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- 自适应 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
