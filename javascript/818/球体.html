<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>球体设计效果图 | Three.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: Arial, Helvetica, sans-serif;
        }
        #info {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            pointer-events: none;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .gradient-text {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div id="info">✨ 球体 · 粒子光环 ✨</div>

    <!-- 引入 Three.js 核心库和扩展 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ---------- 初始化场景 ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);

        // ---------- 相机 (透视) ----------
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 2, 8);
        camera.lookAt(0, 0, 0);

        // ---------- 渲染器 WebGL ----------
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true,
            alpha: false
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = false; // 不需要阴影提升性能
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // ---------- 控制器 (允许用户拖动查看) ----------
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.2;
        controls.enableZoom = true;
        controls.enablePan = false;
        controls.target.set(0, 0, 0);
        controls.update();

        // ---------- 灯光 ----------
        // 环境光 - 柔和的填充光
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // 主光源 - 冷色
        const light1 = new THREE.PointLight(0x4ecdc4, 1.5);
        light1.position.set(5, 5, 5);
        scene.add(light1);

        // 辅助光源 - 暖色
        const light2 = new THREE.PointLight(0xff6b6b, 1.2);
        light2.position.set(-5, 3, -5);
        scene.add(light2);

        // 背光 - 紫色
        const light3 = new THREE.PointLight(0xaa88ff, 0.8);
        light3.position.set(0, -5, -5);
        scene.add(light3);

        // 增加一些点缀光
        const light4 = new THREE.DirectionalLight(0xffffff, 0.5);
        light4.position.set(1, 2, 3);
        scene.add(light4);

        // ---------- 核心球体 (半透明发光材质) ----------
        const sphereGeometry = new THREE.SphereGeometry(1.8, 64, 64);
        const sphereMaterial = new THREE.MeshPhongMaterial({
            color: 0x3a86ff,
            emissive: 0x1a3a6a,
            shininess: 30,
            transparent: true,
            opacity: 0.85,
            wireframe: false,
            emissiveIntensity: 0.6
        });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.castShadow = true;
        sphere.receiveShadow = false;
        scene.add(sphere);

        // ---------- 内层光晕球体 (更亮, 半透明) ----------
        const glowGeometry = new THREE.SphereGeometry(1.6, 48, 48);
        const glowMaterial = new THREE.MeshPhongMaterial({
            color: 0x4ecdc4,
            emissive: 0x2a6a8a,
            transparent: true,
            opacity: 0.25,
            shininess: 60,
            emissiveIntensity: 0.8
        });
        const glowSphere = new THREE.Mesh(glowGeometry, glowMaterial);
        scene.add(glowSphere);

        // ---------- 外部线框球 (科技感) ----------
        const wireframeGeometry = new THREE.SphereGeometry(1.95, 24, 18);
        const wireframeMaterial = new THREE.MeshBasicMaterial({
            color: 0x88ddff,
            wireframe: true,
            transparent: true,
            opacity: 0.15
        });
        const wireframeSphere = new THREE.Mesh(wireframeGeometry, wireframeMaterial);
        scene.add(wireframeSphere);

        // ---------- 粒子光环系统 ----------
        const particleCount = 2800;
        const particles = new THREE.BufferGeometry();
        
        // 位置数组
        const positions = new Float32Array(particleCount * 3);
        // 颜色数组 (每个粒子单独颜色)
        const colors = new Float32Array(particleCount * 3);

        const color1 = new THREE.Color(0x4ecdc4);
        const color2 = new THREE.Color(0xff6b6b);
        const color3 = new THREE.Color(0xaa88ff);

        // 粒子分布: 大部分在球体周围形成光环，少部分随机散布
        for (let i = 0; i < particleCount; i++) {
            // 使用球面坐标生成粒子，半径范围 2.0 ~ 3.5，形成光环效果
            const radius = 2.0 + Math.random() * 1.8;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            
            // 为了形成更丰富的光环，部分粒子集中在赤道附近
            let r = radius;
            let thetaOffset = 0;
            let phiOffset = 0;
            
            if (i < particleCount * 0.6) {
                // 主要光环: 围绕赤道区域 (phi 偏向 PI/2)
                const phiFactor = Math.sin(Math.random() * Math.PI); 
                const phiBase = Math.PI / 2 + (Math.random() - 0.5) * 0.8;
                const thetaBase = Math.random() * Math.PI * 2;
                // 重新计算位置
                const r2 = 2.2 + Math.random() * 1.2;
                const theta2 = thetaBase;
                const phi2 = phiBase + (Math.random() - 0.5) * 0.5;
                
                const x = r2 * Math.sin(phi2) * Math.cos(theta2);
                const y = r2 * Math.sin(phi2) * Math.sin(theta2);
                const z = r2 * Math.cos(phi2);
                
                positions[i*3] = x;
                positions[i*3+1] = y;
                positions[i*3+2] = z;
            } else {
                // 随机散布粒子 (球壳)
                const r2 = 2.0 + Math.random() * 2.5;
                const theta2 = Math.random() * Math.PI * 2;
                const phi2 = Math.acos((Math.random() * 2) - 1);
                const x = r2 * Math.sin(phi2) * Math.cos(theta2);
                const y = r2 * Math.sin(phi2) * Math.sin(theta2);
                const z = r2 * Math.cos(phi2);
                
                positions[i*3] = x;
                positions[i*3+1] = y;
                positions[i*3+2] = z;
            }

            // 颜色: 根据位置和随机混合
            let mixColor;
            const rand = Math.random();
            if (rand < 0.4) {
                mixColor = color1.clone().lerp(color2, Math.random());
            } else if (rand < 0.7) {
                mixColor = color2.clone().lerp(color3, Math.random());
            } else {
                mixColor = color3.clone().lerp(color1, Math.random());
            }
            
            // 增加亮度变化
            mixColor.multiplyScalar(0.7 + Math.random() * 0.5);
            
            colors[i*3] = mixColor.r;
            colors[i*3+1] = mixColor.g;
            colors[i*3+2] = mixColor.b;
        }

        particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particles.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // 粒子材质
        const particleMaterial = new THREE.PointsMaterial({
            size: 0.08,
            vertexColors: true,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            opacity: 0.9,
            sizeAttenuation: true
        });

        const particleSystem = new THREE.Points(particles, particleMaterial);
        scene.add(particleSystem);

        // ---------- 第二层粒子 (小光点, 更远) ----------
        const starCount = 800;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const radius = 4.0 + Math.random() * 3.0;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            starPos[i*3] = radius * Math.sin(phi) * Math.cos(theta);
            starPos[i*3+1] = radius * Math.sin(phi) * Math.sin(theta);
            starPos[i*3+2] = radius * Math.cos(phi);
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0x88aaff,
            size: 0.04,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            opacity: 0.5,
            sizeAttenuation: true
        });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // ---------- 简单装饰: 光晕线条 (使用环) ----------
        const ringGeometry = new THREE.TorusGeometry(2.3, 0.01, 16, 100);
        const ringMaterial = new THREE.MeshBasicMaterial({
            color: 0x4ecdc4,
            transparent: true,
            opacity: 0.15,
            wireframe: false
        });
        const ring1 = new THREE.Mesh(ringGeometry, ringMaterial);
        ring1.rotation.x = Math.PI / 2;
        ring1.rotation.z = 0.3;
        scene.add(ring1);

        const ring2 = new THREE.Mesh(
            new THREE.TorusGeometry(2.6, 0.008, 16, 100),
            new THREE.MeshBasicMaterial({ color: 0xff6b6b, transparent: true, opacity: 0.1 })
        );
        ring2.rotation.y = 0.8;
        ring2.rotation.x = 0.7;
        scene.add(ring2);

        const ring3 = new THREE.Mesh(
            new THREE.TorusGeometry(2.0, 0.006, 16, 100),
            new THREE.MeshBasicMaterial({ color: 0xaa88ff, transparent: true, opacity: 0.12 })
        );
        ring3.rotation.x = 1.2;
        ring3.rotation.y = 0.4;
        scene.add(ring3);

        // ---------- 辅助: 很淡的网格 (可选) ----------
        // 不加网格，保持纯净

        // ---------- 动画循环 ----------
        function animate() {
            requestAnimationFrame(animate);

            // 自动旋转 (由 OrbitControls 的 autoRotate 处理)
            controls.update();

            // 让粒子系统缓慢自转
            particleSystem.rotation.y += 0.0004;
            stars.rotation.y += 0.0001;
            starGeo.rotateY(0.0001); // 缓慢旋转星星
            ring1.rotation.y += 0.001;
            ring2.rotation.x += 0.0005;
            ring3.rotation.z += 0.0008;
            
            // 内部球体微小的脉动 (可选)
            const time = Date.now() * 0.001;
            // sphere.scale.setScalar(1 + Math.sin(time * 0.5) * 0.005);

            renderer.render(scene, camera);
        }

        animate();

        // ---------- 窗口自适应 ----------
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 显示启动提示 (控制台)
        console.log('✨ 球体设计效果图已启动 | 拖动查看 / 滚轮缩放');
    </script>
</body>
</html>
