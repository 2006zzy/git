<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type="text/javascript">
        /*
        对于成绩大于60分输出合格，低于60则输出不合格
        */
       var  a = 61;
       switch(parseInt(a/10)){
        case 10:
            console.log('满分');
            break;
        case 9:
            console.log('优秀');
            break;
        case 8:
            console.log('良好');
            break;
        case 7:
            console.log('合格');
            break;
        case 6:
            console.log('合格');
            break;
        default:
            console.log('输出错误');
            break;
       }
    </script>
</body>
</html>
