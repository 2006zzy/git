<body>
    <script>
        /*if练习
        成绩为100，奖励一辆bmw
        成绩为80-99，奖励一台iphone15s
        成绩为60-80，奖励一本书

        prompt()可以弹出提示框，输入内容作为参数。
        */
       var a = prompt("您的成绩");
       if(a==100){
        alert("恭喜您喜提一亮奔驰")
       }else if(a <100&&a >=60){
        alert("恭喜您及格了，但是没有奖励")
       }else{
        alert("乱填，拉出去毙了！！");
       }
    </script>
