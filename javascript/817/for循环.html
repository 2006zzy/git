<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        for语句，也称为for循环
        */

        var i = 0;
        while (i<10){
            alert(i++);
        }

        //条件表达式
        //初始化表达式
        //更新表达式

        for(var a = 1;a <= 10;a++){
            alert(a);
        }
        // for(初始化表达式;条件表达式;更新表达式){
        //     alert(a);
        // }条件表达式false终止，初始化表达式只执行一次
    </script>
    <script>
        var i = 0;
        for(;i<10;){
            alert(i++);
        }//表达式位置变了，但是效果是一样的。灵活变通。
    </script>
    <script>
        // for(;;){
        //     alert('hello');
        // }//死循环
    </script>
</body>
</html>
