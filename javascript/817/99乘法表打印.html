<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type="text/javascript">
        /*
        九九乘法表打印
        */
       for(var a = 1;a<10;a++){
            for(var b = 1;b<a+1;b++){
                document.write(a+'*'+b+'='+a*b+'&nbsp;' );
            }
            document.write('<br/>')
       }
    </script>
</body>
</html>
