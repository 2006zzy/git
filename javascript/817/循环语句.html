    <!-- 条件表达式为true，往下执行，循环一次之后，仍为true，则继续循环
    直到条件表达式为false,
    break;能终止这个循环。 -->

    <script type="text/javascript">
        var a = 1;
        while (a <= 100){
            document.write(a++ + '<br />' );
        }
    </script>
    <script>
        var c = 1;
        while (true){
            document.write(c++);
            if (c == 10){
                break;//退出循环
            }
        }
    //while 循环三要素
    //初始化一个变量
    //设置一个条件表达式
    //更新表达式，有终止循环的条件

    </script>
    //区别，先执行后判断，先判断后执行，do while
    //至少循环一次
    <script>
    /*
    do{
    执行语句;

        do{
            document.write();
