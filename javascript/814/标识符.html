<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //变量名，函数名，属性名，都属于标识符
        //标识符遵守以下规则
        //1.标识符可以含有字母,数字,_,$，
        //2.不能以数字开头
        //3.不能是es中的关键字,和 保留字
        //4.标识符一般采用驼峰命名法，
        //首字母小写，每个单词开头大写,其余字母小写
        //helloWorld 
        var helloWorld = 123;
        console.log(helloWorld);

        //js保护层采用unicode编码 utf-8
    </script>
</body>
</html>
