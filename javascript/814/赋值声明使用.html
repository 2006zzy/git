<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        *字面量，不可变的值，可以直接使用
        1234567
        *        
        *变量可以用来保存字面量，且可以任意变
        x=1,一般用变量保存字面量
        *
        */
       //声明变量
       //在js中，用var关键字来声明，和c++一样
       var a;//声明
       a=123;//赋值
       a=456;//赋值可变
       console.log(a);//使用

       var b=789;//声明和赋值同时进行

       var age=10;//可以通过变量对字面量进行描述

       

    </script>
</body>
</html>
