<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /*
        Null类型的值只有一个，就是null
        null专门来标记空对象
        */
       var a = null;
       console.log(typeof a);//返回类型object

       var b;
       console.log(b);//声明没赋值，返回undefined
        console.log(typeof b);//same

    </script>
</head>

</html>
